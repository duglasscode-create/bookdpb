<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reproductor · BigNotes</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .msg { color: #ccc; font: 14px/1.5 system-ui, sans-serif; padding: 24px; }
  .msg b { color: #fff; }
</style>
</head>
<body>
<!--
  Puente de reproducción para BigNotes (extensión local de notas).
  YouTube niega su reproductor a las páginas de extensión (errores
  153/152); desde esta página web normal, el mismo vídeo sí se incrusta,
  igual que en Youtube Manager. Uso: player.html?v=ID_DEL_VIDEO
  La página no guarda nada: solo incrusta el vídeo que se le pide.
-->
<div class="msg" id="msg"><b>Reproductor de BigNotes</b><br>Falta el vídeo: esta página se abre desde una nota de BigNotes con un vídeo de YouTube.</div>
<script>
  (function () {
    var v = new URLSearchParams(location.search).get("v") || "";
    if (!/^[A-Za-z0-9_-]{6,}$/.test(v)) return;
    document.title = "Vídeo de YouTube · BigNotes";
    var f = document.createElement("iframe");
    f.src = "https://www.youtube.com/embed/" + v + "?autoplay=1&rel=0&playsinline=1";
    f.title = "Vídeo de YouTube";
    f.setAttribute("allow", "accelerometer; autoplay; encrypted-media; picture-in-picture");
    f.setAttribute("allowfullscreen", "");
    document.getElementById("msg").remove();
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
